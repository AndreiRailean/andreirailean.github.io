name: Astro upgrade check

# Monthly, because Andrei asked for it to be a steward task "on a regular basis
# ... once a month is probably enough", and the steward has no clock of its own
# (`docs/adr/20260901-prompting-is-the-stewards-trigger.md`). So this is the
# clock: it files the task as a `steward` issue, which the next steward finds in
# its queue. `scripts/astro-outdated.ts` decides; `docs/agents/upgrading-astro.md`
# is how to act on it.
#
# **One issue, edited in place.** A month with an upgrade still open rewrites
# the body rather than filing a second, so the issue is always the current
# answer and never a backlog of stale ones. It is found by its exact title.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No install: the script reads the lockfile and asks the registry, and
      # Node runs it as TypeScript directly, as every script here.
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node.outputs.version }}
          install: false

      - name: Ask the registry
        run: node scripts/astro-outdated.ts > upgrade.md

      - name: File or update the steward issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Astro upgrade available"
        run: |
          existing=$(gh issue list --state open --label steward --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          # Nothing to upgrade closes a leftover issue, so an upgrade merged
          # without closing it does not read as still to do.
          if [ ! -s upgrade.md ]; then
            echo "Everything watched is current."
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Everything watched is current, checked by the monthly run."
            fi
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file upgrade.md
            echo "Updated #$existing."
          else
            gh issue create --title "$TITLE" --label steward --body-file upgrade.md
          fi
