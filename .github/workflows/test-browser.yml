name: Browser tests

# Every `.spec.ts` here navigates to `/experiments/...`, so a change that cannot
# reach the section cannot break them. Running the browser suite over five pieces
# to approve a paragraph on the resume is the friction
# `docs/adr/20260828-experiments-stay-in-the-site-repo.md` named as the cheapest
# thing to fix. See #143.
#
# **The filter lives here and only here.** It used to sit on a shared `test.yml`
# and therefore also skipped the unit suite, which is how
# `tests/unit/adr-format.test.ts` came to be unable to fail on an ADR-only pull
# request — it reads the two directories the list ignores. `test-unit.yml` is now
# unfiltered and carries that history; #166. The eight minutes this filter saves
# was always the whole point of having one, and the unit suite's two minutes
# never was.
#
# **`paths-ignore` rather than `paths`, deliberately.** The two fail in opposite
# directions, and only one of them fails safely: a path nobody remembered to add
# to an allow-list silently stops being tested, while a path nobody remembered to
# add here merely runs the suite it did not need. That is the reverse of the
# allow-list in `src/experiments/AGENTS.md`, where skipping is the safe default,
# and the reasoning is the same in both places — pick the direction where
# forgetting is cheap.
#
# So this lists only what is provably unreachable from a page under
# `/experiments/`. `src/pages/` is named file by file rather than as a folder,
# because `src/pages/experiments/` lives under it and `paths-ignore` has no way
# to carve an exception back out.
#
# **Prose is here too, and the list is specific rather than `**/*.md`.** Agent
# docs, ADRs and skills change constantly and no *browser* test reads any of
# them. That qualifier is load-bearing now: the unfiltered form of this comment
# said "no test reads any of them", which stopped being true the day #161 gave
# `docs/adr` and `src/experiments/docs/adr` their first reader, and nothing
# noticed because the claim was in a comment rather than in a check.
#
# The blanket form is the trap to refuse: **`src/experiments/*/about.md` is
# content, not prose.** It feeds the collection `/experiments/` is generated
# from, and `tests/experiments-index.spec.ts` pins that index's contents while
# `tests/experiments-notes.spec.ts` pins the notes. Ignoring every `.md` would
# stop testing the one kind that is tested, silently, which is the failure mode
# `paths-ignore` was chosen to avoid in the first place.
# `tests/unit/ci-paths.test.ts` holds that line so it does not depend on the next
# person reading this comment.
#
# **`lint` is deliberately NOT filtered**, and must not be. It is the only
# required status check on `main`, and a required check that never runs leaves a
# pull request permanently *pending* rather than passing — so filtering it would
# block exactly the changes this is meant to speed up. It costs about 30 seconds
# and covers everything. If `Browser tests` is ever made required, this filter
# has to go or grow a job that always reports.
on:
  pull_request:
    paths-ignore:
      - "src/assets/**"
      - "src/components/**"
      - "src/layouts/**"
      - "src/lib/**"
      - "src/styles/**"
      - "src/pages/index.astro"
      - "src/pages/resume.md"
      - "public/**"
      - "docs/**"
      - "src/experiments/docs/**"
      - "**/AGENTS.md"
      - ".claude/**"
      - "*.md"

# A second push to the same branch supersedes the first, so an iterative session
# does not leave a queue of runs testing commits nobody will merge. Keyed on the
# ref rather than the workflow alone, or one branch's push would cancel another's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job rather than two steps beside the unit suite, because the browser suite
# is most of the wall clock and the unit suite needs none of what makes it slow.
# Measured on a green run before the split: install 6s, Chromium 23s, unit 108s,
# browser 336s, all in series. Run side by side, the longer job sets the clock —
# roughly 365s against 473s, a fifth off, for the same compute plus one extra
# checkout and install. Re-measured on #138 as unit 2m24s against browser 8m0s.
#
# What is lost: the unit suite no longer runs *first*, so a broken solver and a
# broken page surface together rather than in seconds. That was the reason they
# were ordered, and it is worth less than it sounds — the unit job finishes and
# reports in about two minutes, and it fails its own check independently, so
# nothing waits on the browser suite to learn about it.
#
# See #133 for what this does not touch: `fullyParallel`, which would spread a
# spec's tests across workers and could trade slow for flaky on a shared dev
# server, and the audit of which tests need a browser at all.
jobs:
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node.outputs.version }}
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright has no install script, so its browsers arrive only from this.
      # Chromium alone: the suite declares one project and nothing needs the
      # others. `--with-deps` covers the system libraries the runner lacks.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Builds the site and serves dist/ with `astro preview`; it does not run
      # `astro dev`. See tests/support/preview-server.ts and
      # docs/adr/20260912-previews-and-tests-run-against-a-static-build.md.
      #
      # So this job now exercises the artefact that deploys. That is not a
      # nicety: a page once referenced an `_astro/` asset the build never wrote,
      # and the suite passed because `astro dev` serves imports off disk. The
      # only symptom was a 404 in production, found by a person.
      #
      # PW_USE_BUNDLED_CHROMIUM so this tests the build installed above rather
      # than whatever the runner image happens to ship.
      - name: Browser tests
        run: pnpm run test:browser
        env:
          PW_USE_BUNDLED_CHROMIUM: "1"

      # The stills are not compared to anything, so they are only worth keeping
      # when something failed and a human wants to look at the scene.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-artifacts
          path: |
            .scratch/shots/
            .scratch/playwright/
          retention-days: 7
          if-no-files-found: ignore
