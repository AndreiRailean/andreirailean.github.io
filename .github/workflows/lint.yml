name: Lint code

on:
  - pull_request

# A second push to the same branch supersedes the first, so an iterative session
# does not leave a queue of runs testing commits nobody will merge. Keyed on the
# ref rather than the workflow alone, or one branch's push would cancel another's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint all code
        run: npm run prettier && npm run lint

      - name: Typecheck all code
        run: npm run typecheck

      - name: Test build
        run: npm run build
