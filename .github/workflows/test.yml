name: Test code

# Both suites are entirely about the experiments: every `.spec.ts` navigates to
# `/experiments/...`, and every directory under `tests/unit/` is a piece, the
# gallery or the kit. A change that cannot reach any of that cannot break them,
# and running the browser suite over five pieces to approve a paragraph on the
# resume is the friction `docs/adr/20260828-experiments-stay-in-the-site-repo.md`
# named as the cheapest thing to fix. See #143.
#
# **`paths-ignore` rather than `paths`, deliberately.** The two fail in opposite
# directions, and only one of them fails safely: a path nobody remembered to add
# to an allow-list silently stops being tested, while a path nobody remembered to
# add here merely runs the suite it did not need. That is the reverse of the
# allow-list in `src/experiments/AGENTS.md`, where skipping is the safe default,
# and the reasoning is the same in both places — pick the direction where
# forgetting is cheap.
#
# So this lists only what is provably site-only. `src/pages/` is named file by
# file rather than as a folder, because `src/pages/experiments/` lives under it
# and `paths-ignore` has no way to carve an exception back out.
#
# **`lint` is deliberately NOT filtered**, and must not be. It is the only
# required status check on `main`, and a required check that never runs leaves a
# pull request permanently *pending* rather than passing — so filtering it would
# block exactly the changes this is meant to speed up. It costs about 30 seconds
# and covers everything. If `Unit tests` or `Browser tests` are ever made
# required, this filter has to go or grow a job that always reports.
on:
  pull_request:
    paths-ignore:
      - "src/assets/**"
      - "src/components/**"
      - "src/layouts/**"
      - "src/lib/**"
      - "src/styles/**"
      - "src/pages/index.astro"
      - "src/pages/resume.md"
      - "public/**"
      - "docs/**"
      - "*.md"

# A second push to the same branch supersedes the first, so an iterative session
# does not leave a queue of runs testing commits nobody will merge. Keyed on the
# ref rather than the workflow alone, or one branch's push would cancel another's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two jobs rather than two steps, because the browser suite is most of the wall
# clock and the unit suite needs none of what makes it slow. Measured on a green
# run before the split: install 6s, Chromium 23s, unit 108s, browser 336s, all
# in series. Run side by side, the longer job sets the clock — roughly 365s
# against 473s, a fifth off, for the same compute plus one extra checkout and
# install.
#
# The unit job also skips the Chromium download entirely, which is the part of
# the setup that is not cached.
#
# What is lost: the unit suite no longer runs *first*, so a broken solver and a
# broken page now surface together rather than in seconds. That was the reason
# they were ordered, and it is worth less than it sounds — the unit job still
# finishes and reports in about two minutes, and it fails its own check
# independently, so nothing waits on the browser suite to learn about it.
#
# See #133 for what this does not touch: `fullyParallel`, which would spread a
# spec's tests across workers and could trade slow for flaky on a shared dev
# server, and the audit of which tests need a browser at all.
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # See lint.yml for why this is pnpm/setup rather than actions/setup-node,
      # why `.node-version` is read into an output, and why the install is a step
      # of its own rather than the action's `require-lockfile`.
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node.outputs.version }}
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No Playwright browsers here: nothing under tests/unit/ opens a page, and
      # that is the whole point of the split.
      - name: Unit tests
        run: pnpm run test:unit

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node.outputs.version }}
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright has no install script, so its browsers arrive only from this.
      # Chromium alone: the suite declares one project and nothing needs the
      # others. `--with-deps` covers the system libraries the runner lacks.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Starts its own Astro dev server; see tests/support/dev-server.ts.
      # PW_USE_BUNDLED_CHROMIUM so this tests the build installed above rather
      # than whatever the runner image happens to ship.
      - name: Browser tests
        run: pnpm run test:browser
        env:
          PW_USE_BUNDLED_CHROMIUM: "1"

      # The stills are not compared to anything, so they are only worth keeping
      # when something failed and a human wants to look at the scene.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-artifacts
          path: |
            .scratch/shots/
            .scratch/playwright/
          retention-days: 7
          if-no-files-found: ignore
