name: Test code

on:
  - pull_request

# A second push to the same branch supersedes the first, so an iterative session
# does not leave a queue of runs testing commits nobody will merge. Keyed on the
# ref rather than the workflow alone, or one branch's push would cancel another's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # See lint.yml for why this is pnpm/setup rather than actions/setup-node,
      # why `.node-version` is read into an output, and why the install is a step
      # of its own rather than the action's `require-lockfile`.
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node.outputs.version }}
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright has no install script, so its browsers arrive only from this.
      # Chromium alone: the suite declares one project and nothing needs the
      # others. `--with-deps` covers the system libraries the runner lacks.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Fast, and needs nothing but node. Runs first so a broken solver fails in
      # seconds rather than after a dev server has started.
      - name: Unit tests
        run: pnpm run test:unit

      # Starts its own Astro dev server; see tests/support/dev-server.ts.
      # PW_USE_BUNDLED_CHROMIUM so this tests the build installed above rather
      # than whatever the runner image happens to ship.
      - name: Browser tests
        run: pnpm run test:browser
        env:
          PW_USE_BUNDLED_CHROMIUM: "1"

      # The stills are not compared to anything, so they are only worth keeping
      # when something failed and a human wants to look at the scene.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-artifacts
          path: |
            .scratch/shots/
            .scratch/playwright/
          retention-days: 7
          if-no-files-found: ignore
