name: Runner store

# **A committed runner is never modified or renamed. Removing an unreferenced one
# is allowed.** Additions are the whole point and pass.
#
# ## What changed, and why the D came out
#
# This forbade deletion too, because nobody could prove who still held a runner.
# That was right while the consuming set was unknowable. It is knowable —
# everything that names a runner is in this repo — and
# `tests/unit/showcase-runners.test.ts` now fails when a *named* one goes
# missing, whoever names it, found by scanning every tracked file rather than
# from a list of destinations that would go stale.
#
# So the property worth enforcing stopped being "nothing leaves" and became
# "nothing needed leaves", and that one is checked in the tree, where the
# evidence is. Keeping a runner nothing names, against a reader nobody can
# identify, is insurance against a risk that does not exist — and git already
# holds every deleted file, so the recovery it was buying was already bought.
# `pnpm run prune` removes them; `pnpm run prune --list` only names them.
#
# **This becomes wrong the moment a runner URL can leave this repo.** A
# copy-embed button would put one on a page nobody here controls, and no runner
# would ever again be provably unreferenced. Put the D back that day.
#
# ## Why M, R and T stay, when a unit test already checks integrity
#
# Two of them are belt and braces: a runner is named by the hash of its bytes, so
# an edited or renamed one already fails `showcase-runners.test.ts`. **T is the
# one that is not redundant** — replacing a runner with a symlink to another is a
# deletion wearing a disguise, and a test that reads the file follows the link
# and finds bytes that hash correctly.
#
# ## Why a workflow of its own
#
# **It cannot live in `test-browser.yml`**, and that is a fact rather than a
# preference: `public/**` is on that workflow's `paths-ignore`. A pull request
# whose whole diff is a deleted runner touches nothing else, so the job would not
# run — the check would be structurally unable to fire on exactly the change it
# polices. That is #166 one directory over.
#
# **Nor in `lint`**, which is the only required status check on `main` and so the
# one job whose latency everybody pays. It should stay boring and fast rather
# than grow a deeper checkout to serve one directory.
#
# It also needs a checkout configuration no other job wants, which is its own
# argument for isolation. **And it carries no path filter**, deliberately: the
# direction where forgetting is cheap, per `test-unit.yml` and #166.
on:
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  append-only:
    name: Runner store is append-only
    runs-on: ubuntu-latest
    steps:
      # **Two, not zero.** On a `pull_request` event `actions/checkout` checks
      # out the *merge ref* — a merge commit whose first parent is the base
      # branch tip and whose second is the pull request head. So the base is one
      # commit away and full history buys nothing. `fetch-depth: 0` was the
      # obvious form and would grow with the repo forever.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: No runner was modified or renamed
        run: |
          set -euo pipefail

          # **Establish the base before asserting anything about it.** "No output"
          # is this check's success condition, so a checkout that cannot reach the
          # base reads as a clean pass — the vacuous-check shape this repo keeps
          # producing. HEAD^1 is only the base branch on the merge ref, so prove
          # we are on one by requiring a second parent.
          if ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            echo "::error title=Cannot establish a base::HEAD has no second parent, so this is not the pull request merge ref and HEAD^1 is not the base branch. Refusing to pass without comparing anything."
            exit 1
          fi

          base="$(git rev-parse 'HEAD^1')"
          head="$(git rev-parse 'HEAD^2')"
          echo "base (HEAD^1)  $base"
          echo "head (HEAD^2)  $head"

          # M modified, R renamed, T type changed — the last because replacing a
          # runner with a symlink is a deletion wearing a disguise that a test
          # reading the file would follow and find correct.
          #
          # **D is absent on purpose.** Removing a runner nothing names is
          # `pnpm run prune` doing its job, and the case that matters — a runner
          # something still names going missing — is caught in the tree by
          # `tests/unit/showcase-runners.test.ts`.
          #
          # A (added) is absent because growing the store is the point.
          changed="$(git diff --diff-filter=MRT --name-only "$base" HEAD -- public/showcase/runners/)"

          if [ -n "$changed" ]; then
            echo "::error title=A committed runner changed::A runner is named by the hash of its own bytes, so editing or renaming one silently changes what every page pinning it renders. Publish a new runner instead of editing one that is already there."
            printf '%s\n' "$changed"
            exit 1
          fi

          echo "No runner was modified or renamed."

      # **A warning, never a failure.** A runner nothing names costs 22kb and is
      # visible to `ls`; the failure this repo needs checks for is the silent one,
      # and that is the tree check above. Failing here would fail on something
      # that is not a defect, and the instruction would be the same every time —
      # which is a command rather than a check, and the command is `pnpm run
      # prune`.
      #
      # It is here so that a session reading a CI run sees the store growing
      # without anyone having to remember to look.
      - name: Unreferenced runners
        run: |
          set -euo pipefail

          unpruned="$(node scripts/prune-runners.ts --list)"
          printf '%s\n' "$unpruned"

          if printf '%s' "$unpruned" | grep -q '^unpruned'; then
            summary="$(printf '%s' "$unpruned" | grep '^prune:' || true)"
            echo "::warning title=Unreferenced runners::${summary:-Some runners are unreferenced.} Not a failure — nothing points at them, git still holds them, and removing them is optional."
          fi
